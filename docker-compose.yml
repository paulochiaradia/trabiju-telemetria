version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db_prod
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data_prod:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: go_backend_prod
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8080"
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - DB_HOST=mysql
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - app-network

volumes:
  db_data_prod:

networks:
  app-network:
    driver: bridge
